<style>
:root{
  --bg-1:#140b12; --bg-2:#2b1520; --bg-3:#3a1d2a;
  --gold:#d9b46a; --gold-hi:#f6e3b0; --gold-lo:#9c7330;
  --rose:#e3a6ae; --ink:#f7ede4; --ink-dim:rgba(247,237,228,.62);
  --line:rgba(217,180,106,.35); --glass:rgba(40,20,30,.45);
  --lit:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-1:#140b12; --bg-2:#2b1520; --bg-3:#3a1d2a;
    --gold:#d9b46a; --gold-hi:#f6e3b0; --gold-lo:#9c7330;
    --rose:#e3a6ae; --ink:#f7ede4; --ink-dim:rgba(247,237,228,.62);
    --line:rgba(217,180,106,.35); --glass:rgba(40,20,30,.45);
  }
}
:root[data-theme="dark"]{
  --bg-1:#140b12; --bg-2:#2b1520; --bg-3:#3a1d2a;
  --gold:#d9b46a; --gold-hi:#f6e3b0; --gold-lo:#9c7330;
  --rose:#e3a6ae; --ink:#f7ede4; --ink-dim:rgba(247,237,228,.62);
  --line:rgba(217,180,106,.35); --glass:rgba(40,20,30,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-1);
  background-image:radial-gradient(120% 80% at 50% 38%, var(--bg-3) 0%, var(--bg-2) 38%, var(--bg-1) 78%);
  color:var(--ink);
  font-family:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB",serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
main,.card,.gift{-webkit-user-select:none;user-select:none}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:40}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%)}
main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 16px 40px;gap:8px;text-align:center;overflow-x:hidden;overflow-x:clip}

/* ---------- headline ---------- */
.eyebrow{font-family:"Great Vibes",cursive;font-weight:400;letter-spacing:.02em;
  font-size:clamp(26px,6.5vw,34px);line-height:1.2;color:var(--gold);opacity:0;animation:fadeUp 1.4s .2s forwards}
.eyebrow::before,.eyebrow::after{content:"✦";display:inline-block;width:auto;font-size:.45em;color:var(--gold);background:none !important;height:1px;background:linear-gradient(90deg,transparent,var(--gold));
  vertical-align:middle;margin:0 14px}
.eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}
h1{font-weight:700;font-size:clamp(42px,11vw,76px);letter-spacing:.14em;line-height:1.25;margin-top:6px;
  background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold-hi) 30%,#fff7e2 45%,var(--gold) 60%,var(--gold-lo) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite, fadeUp 1.6s .45s both}
.status{min-height:1.6em;font-size:clamp(14px,3.6vw,16px);color:var(--ink-dim);letter-spacing:.08em;
  transition:opacity .5s;opacity:0;animation:fadeUp 1.4s 1s forwards}

/* ---------- cake ---------- */
.stage{position:relative;width:min(92vw,440px);
  width:clamp(210px, min(92vw, 440px, calc((100vh - 300px) * 1.04)), 440px);
  width:clamp(210px, min(92vw, 440px, calc((100svh - 300px) * 1.04)), 440px);
  margin-top:4px;opacity:0;animation:fadeUp 1.8s .7s forwards}
.ambient{position:absolute;left:50%;top:22%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,190,110,.32) 0%, rgba(255,150,90,.12) 30%, transparent 62%);
  opacity:calc(var(--lit) * 1);pointer-events:none;transition:opacity .3s;filter:blur(4px)}
#cake{position:relative;width:100%;height:auto;display:block;overflow:visible}
.flame{cursor:pointer}
.flame .flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame .glow{mix-blend-mode:screen;transition:opacity .35s}
.flame .bend{transition:opacity .3s}
.flame.unlit .bend,.flame.unlit .glow,.flame.out .bend,.flame.out .glow{opacity:0 !important}
.flame .ember{opacity:0}
.flame.out .ember{animation:ember 2.4s ease-out forwards}
.toplight{transition:opacity .3s}

@keyframes flick{
  0%,100%{transform:scale(1,1) rotate(0deg)}
  18%{transform:scale(.95,1.06) rotate(-2.2deg)}
  37%{transform:scale(1.04,.95) rotate(1.4deg)}
  55%{transform:scale(.97,1.08) rotate(-.8deg)}
  74%{transform:scale(1.03,.97) rotate(2deg)}
}
@keyframes ember{0%{opacity:1}100%{opacity:0}}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;opacity:0;animation:fadeUp 1.4s 1.3s forwards;transition:opacity .6s, transform .6s}
.btn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);
  font-family:inherit;font-size:15px;letter-spacing:.1em;padding:12px 22px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:border-color .3s, background .3s, transform .2s, box-shadow .3s;user-select:none;-webkit-user-select:none;touch-action:none}
.btn:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(217,180,106,.18)}
.btn:active,.btn.pressed{transform:scale(.97);background:rgba(217,180,106,.16)}
.btn.on{border-color:var(--gold);color:var(--gold-hi)}
.btn svg{width:18px;height:18px;flex:none}
.meter{width:min(70vw,240px);height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:14px auto 0;overflow:hidden;
  opacity:0;transition:opacity .5s}
.meter.show{opacity:1}
.meter{display:none !important}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));border-radius:3px}
body.celebrate .controls,body.celebrate .meter{opacity:0;pointer-events:none;transform:translateY(8px)}

.hint{min-height:1.7em;margin-top:6px;color:var(--gold-hi);font-size:clamp(15px,4vw,17px);letter-spacing:.08em;
  opacity:0;transform:translateY(6px);transition:opacity .6s, transform .6s}
.hint.show{opacity:1;transform:none}
body.celebrate .hint{opacity:0}
#ribF,#ribT,#bowL,#bowR,#knot,#tailL,#tailR,#tag{transform-box:fill-box;transition:transform .8s cubic-bezier(.5,0,.3,1), opacity .7s ease}
#ribF{transform-origin:50% 100%}#ribT{transform-origin:50% 100%}
#bowL{transform-origin:100% 50%}#bowR{transform-origin:0% 50%}#knot,#tag{transform-origin:50% 50%}
.untie #bowL{transform:translate(-70px,-30px) rotate(-200deg) scale(.6);opacity:0}
.untie #bowR{transform:translate(70px,-30px) rotate(200deg) scale(.6);opacity:0}
.untie #knot{transform:translateY(-30px) scale(.3);opacity:0}
.untie #tailL{transform:translate(-40px,60px) rotate(-60deg);opacity:0}
.untie #tailR{transform:translate(40px,60px) rotate(60deg);opacity:0}
.untie #ribT{transform:scaleY(0);opacity:0}
.untie #ribF{transform:scaleY(0);transition-delay:.25s}
.untie #tag{transform:translateY(30px) rotate(8deg);opacity:0;transition-delay:.2s}
.untie .bob{animation:none}
.bob{animation:boxbob 2.6s ease-in-out infinite}
@keyframes boxbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.intro-box,.intro-lighter,#candles,#flames{transition:transform 1.3s cubic-bezier(.5,0,.2,1), opacity .9s ease}

/* ---------- mic button ---------- */
.micfab{position:fixed;z-index:16;top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  border:1px solid var(--line);background:var(--glass);color:var(--gold-hi);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent;
  animation:micpulse 2.2s ease-in-out infinite;transition:background .3s, color .3s, opacity .6s}
.micfab svg{width:22px;height:22px}
.micfab.on{background:linear-gradient(135deg,#f0d58f,#c99a48);color:#2a1219;border-color:transparent;animation:none}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,213,143,.5)}50%{box-shadow:0 0 0 12px rgba(240,213,143,0)}}
body.celebrate .micfab{opacity:0;pointer-events:none}

/* ---------- card ---------- */
.scrim{position:fixed;inset:0;z-index:14;background:rgba(10,4,8,.42);opacity:0;pointer-events:none;transition:opacity 1.2s}
body.celebrate .scrim{opacity:1}
.card{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:15;
  width:min(calc(100vw - 32px),460px);transform:translate(-50%,30px);opacity:0;pointer-events:none;
  max-height:calc(100vh - 32px);max-height:calc(100svh - 32px);overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(160deg,rgba(60,30,42,.78),rgba(28,14,22,.86));
  border:1px solid var(--line);border-radius:22px;padding:28px 26px 22px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(246,227,176,.12);
  transition:opacity 1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(217,180,106,.16);border-radius:16px;pointer-events:none}
.card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card .salute{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:15px;letter-spacing:.24em;margin-bottom:10px}
.card p{font-size:clamp(15px,3.9vw,17px);line-height:1.95;letter-spacing:.06em;color:var(--ink);opacity:0;transform:translateY(8px);
  transition:opacity .9s ease, transform .9s ease}
.card p{text-align:center;white-space:nowrap}
.card p + p{margin-top:16px}
.card p.lead{font-size:clamp(19px,5.2vw,22px);letter-spacing:.14em;color:var(--gold-hi);margin-bottom:4px}
.card p.wish{color:var(--gold-hi);margin-top:20px}
.card p.lead::after{content:"";display:block;width:56px;height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card.show p{opacity:1;transform:none}
.card .actions{display:flex;gap:10px;justify-content:center;margin-top:18px;opacity:0;transition:opacity 1s 2.6s}
.card.show .actions{opacity:1}
.card .btn{font-size:14px;padding:10px 18px}
.btn.primary{background:linear-gradient(135deg,#f0d58f,#c99a48);color:#2a1219;border-color:transparent;font-weight:500;
  animation:pulse 2.4s ease-in-out infinite}
.btn.primary:hover{box-shadow:0 0 30px rgba(246,227,176,.45)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,213,143,.45)}50%{box-shadow:0 0 0 10px rgba(240,213,143,0)}}

/* ---------- photos (optional) ---------- */
.photos{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 6px 16px;margin:0 -8px 6px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos:empty{display:none}
.photos figure{flex:0 0 auto;width:clamp(108px,32vw,138px);background:#fbf6ee;padding:6px 6px 0;border-radius:3px;scroll-snap-align:center;
  transform:rotate(var(--r,0deg));box-shadow:0 10px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .8s, transform .8s}
.card.show .photos figure{opacity:1}
.photos img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:1px;pointer-events:none}
.photos figcaption{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-style:italic;color:#5a3a2e;font-size:13px;
  padding:6px 2px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:12px}

/* ---------- memories ---------- */
.mem{position:fixed;inset:0;z-index:28;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(90% 70% at 50% 45%, rgba(58,28,41,.985), rgba(14,7,11,.995));
  opacity:0;visibility:hidden;transition:opacity .9s ease, visibility 0s linear .9s}
.mem.show{opacity:1;visibility:visible;transition:opacity .9s ease}
.mem-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));text-align:center}
.mem .gift-hint{margin-bottom:2px}
.nextbtn{margin-top:4px;flex:none;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .8s, transform .8s}
.nextbtn.show{opacity:1;transform:none;pointer-events:auto}
.mem .card{padding:22px 20px 18px}
.mem .card p + p{margin-top:12px}
@media (min-width:820px){ .mem-inner{padding-top:28px;gap:22px} }
.deck{--dw:min(86vw,440px);--dh:min(58vh,540px);position:relative;width:var(--dw);height:var(--dh);touch-action:pan-y;flex:none}
@supports (height:1svh){.deck{--dh:min(58svh,540px)}}
.deck figure{position:absolute;left:50%;top:50%;margin:0;background:#fbf6ee;padding:8px 8px 30px;border-radius:3px;cursor:pointer;
  box-shadow:0 24px 50px rgba(0,0,0,.55);transition:transform 1.1s cubic-bezier(.2,.9,.25,1), opacity .7s ease;will-change:transform}
.deck img{display:block;max-width:calc(var(--dw) - 28px);max-height:calc(var(--dh) - 50px);width:auto;height:auto;pointer-events:none;-webkit-user-drag:none}
.dots{display:flex;gap:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(246,227,176,.25);transition:background .4s, transform .4s}
.dots i.on{background:var(--gold-hi);transform:scale(1.3)}
.mem-tip{color:var(--ink-dim);font-size:13px;letter-spacing:.1em}
.mem .btn.primary{margin-top:4px}

.mem-row{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.mem .deck{--dw:min(84vw,380px);--dh:min(30vh,300px)}
@supports (height:1svh){.mem .deck{--dh:min(30svh,300px)}}
.mem .card{position:relative;left:auto;bottom:auto;z-index:auto;width:min(100%,440px);max-height:none;overflow:visible;
  transform:translateY(20px);margin:0 auto}
.mem .card.show{transform:none}
@media (min-width:820px){
  .mem-row{flex-direction:row;justify-content:center;gap:56px}
  .mem .deck{--dw:min(42vw,460px);--dh:min(60vh,520px)}
}

@media (min-width:820px){ .mem .card{margin:0} }

/* ---------- gift scene ---------- */
.gift{position:fixed;inset:0;z-index:30;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(90% 70% at 50% 45%, rgba(58,28,41,.985), rgba(14,7,11,.995));
  opacity:0;visibility:hidden;transition:opacity .9s ease, visibility 0s linear .9s}
.gift.show{opacity:1;visibility:visible;transition:opacity .9s ease}
.gift-inner{min-height:100%;display:grid;place-items:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}
.gift-inner > *{grid-area:1/1}
.boxwrap{display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .7s, transform .9s cubic-bezier(.2,.8,.2,1)}
.gift.opened .boxwrap{opacity:0;transform:scale(.7);pointer-events:none}
.gift-hint{color:var(--gold);font-family:"Great Vibes",cursive;letter-spacing:.02em;font-size:clamp(28px,7vw,36px);line-height:1.2}
.gift-hint2{color:var(--ink-dim);letter-spacing:.12em;font-size:15px;transition:opacity .4s}
.gift.opening .gift-hint2,.gift.opening .gift-hint{opacity:0;transition:opacity .4s}
.box-area{position:relative;width:min(58vw,280px);width:min(58vw,280px,38svh);aspect-ratio:1}
.rays{position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(246,227,176,.20) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle, #000 0 12%, transparent 55%);mask-image:radial-gradient(circle, #000 0 12%, transparent 55%);
  opacity:.25;animation:spin 30s linear infinite;transition:opacity 1s}
.gift.opening .rays{opacity:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.giftbox{appearance:none;border:0;background:none;padding:0;cursor:pointer;position:absolute;inset:0;display:block;
  animation:bob 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent;outline-offset:8px}
.giftbox:focus-visible{outline:1px solid var(--gold)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-6px) rotate(-1.5deg)}70%{transform:translateY(-3px) rotate(1.5deg)}}
.gift.opening .giftbox{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-4deg) scale(1.03)}40%{transform:rotate(4deg) scale(1.05)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.gb-body{position:absolute;left:9%;right:9%;bottom:4%;height:56%;border-radius:6px;
  background:linear-gradient(90deg,#4a1020,#7a2840 28%,#963a52 50%,#7a2840 72%,#4a1020);
  box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 14px 18px rgba(0,0,0,.28)}
.gb-body::before,.gb-lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);
  background:linear-gradient(90deg,#9c7330,#f6e3b0 45%,#d9b46a 60%,#9c7330)}
.gb-lid{position:absolute;left:4%;right:4%;top:28%;height:17%;border-radius:6px;z-index:2;
  background:linear-gradient(90deg,#561428,#8e3249 28%,#ab4760 50%,#8e3249 72%,#561428);
  box-shadow:0 10px 16px rgba(0,0,0,.4);transform-origin:15% 100%;
  transition:transform 1.1s cubic-bezier(.3,1.3,.5,1), opacity .6s .5s}
.gift.opening .gb-lid{transform:translate(-18%,-190%) rotate(-32deg);opacity:0}
.bow{position:absolute;left:50%;bottom:88%;width:46%;height:170%;transform:translateX(-50%)}
.bow i{position:absolute;bottom:4%;width:50%;height:78%;border-radius:50% 50% 45% 45%;
  background:radial-gradient(ellipse at 50% 62%, #7a5622 0 18%, transparent 20%), linear-gradient(140deg,#fff0c6,#d9b46a 45%,#8a6326)}
.bow i:first-child{left:0;transform:rotate(-30deg);transform-origin:100% 100%}
.bow i:nth-child(2){right:0;transform:rotate(30deg);transform-origin:0 100%}
.bow b{position:absolute;left:50%;bottom:-6%;width:22%;height:36%;transform:translateX(-50%);border-radius:35%;
  background:linear-gradient(140deg,#fff0c6,#c99a44 60%,#8a6326)}
.burstlight{position:absolute;left:50%;top:45%;width:10%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,#fff8e0,rgba(255,220,150,.6) 40%,transparent 70%);opacity:0}
.gift.opening .burstlight{animation:flash 1.2s .35s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(14)}}

.reveal{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  opacity:0;pointer-events:none}
.gift.opened .reveal{opacity:1;pointer-events:auto}
.reveal > *{opacity:0;transform:translateY(14px);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1)}
.gift.opened .reveal > *{opacity:1;transform:none}
.reveal .r-eye{font-family:"Great Vibes",cursive;color:var(--gold);letter-spacing:.02em;font-size:clamp(28px,7vw,36px);line-height:1.2}
.mask-icon{width:min(46vw,170px);height:auto;margin:4px 0 2px;filter:drop-shadow(0 0 18px rgba(246,227,176,.35))}
.mask-icon .heat{animation:heat 2.2s ease-in-out infinite}
.mask-icon .heat:nth-of-type(2){animation-delay:.3s}.mask-icon .heat:nth-of-type(3){animation-delay:.6s}
@keyframes heat{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
.reveal h2{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(30px,8vw,42px);letter-spacing:.04em;line-height:1.1;
  background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 35%,#fff7e2 50%,var(--gold) 65%,var(--gold-lo));
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.reveal .r-sub{color:var(--ink);letter-spacing:.3em;font-size:clamp(18px,4.8vw,20.5px);margin-top:0}
.chips{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 2px}
.chips li{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;letter-spacing:.08em;color:var(--gold-hi);background:rgba(217,180,106,.07)}
.reveal .r-note{color:var(--ink-dim);font-size:clamp(14px,3.8vw,16px);line-height:1.9;letter-spacing:.06em;max-width:30em}
.cue{margin-top:8px;font-size:clamp(16px,4.6vw,23px);letter-spacing:.06em;white-space:nowrap;color:#2a1219;font-weight:500;
  background:linear-gradient(135deg,#f6e3b0,#d9b46a 55%,#c08d3e);padding:14px 22px;border-radius:999px;
  animation:pulse 2s ease-in-out infinite}
.reveal .btn{margin-top:10px;font-size:13px;padding:9px 18px}
body.celebrate .stage{transform:translateY(-6vh) scale(.9);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.stage{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}

/* ---------- smoke ---------- */
.smoke{position:fixed;z-index:12;width:14px;height:14px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(225,218,228,.55),rgba(225,218,228,0) 70%);filter:blur(3px);
  animation:rise var(--dur,2.6s) ease-out forwards;animation-delay:var(--delay,0s);opacity:0}
@keyframes rise{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  12%{opacity:.8}
  60%{transform:translate(calc(-50% + var(--dx1)),calc(-50% - 70px)) scale(1.8);opacity:.35}
  100%{transform:translate(calc(-50% + var(--dx2)),calc(-50% - 150px)) scale(3.2);opacity:0}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-130% 0}}
footer{position:relative;z-index:2;text-align:center;padding:0 16px 22px;font-family:"Cormorant Garamond",serif;font-style:italic;
  color:rgba(217,180,106,.45);letter-spacing:.2em;font-size:13px}
@media (prefers-reduced-motion: reduce){
  h1{animation:fadeUp 1s both}
  .flame .flicker{animation-duration:3.2s}
}
@media (max-width:420px){
  main{padding:24px 16px 32px;gap:6px}
  .eyebrow::before,.eyebrow::after{width:20px;margin:0 10px}
  .btn{padding:11px 18px;font-size:14px}
  .card{padding:24px 18px 18px}
  .card p{letter-spacing:.02em}
}
@media (max-height:520px) and (orientation:landscape){
  main{padding:14px 16px;gap:2px}
  h1{font-size:30px}
  .eyebrow{font-size:11px}
  .controls{margin-top:4px}
}

  const master = ctx.createGain(); master.gain.value = .5;
  const delay = ctx.createDelay(); delay.delayTime.value = .27;
  const fb = ctx.createGain(); fb.gain.value = .28;
  const wet = ctx.createGain(); wet.gain.value = .3;
  master.connect(comp); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
  let t = ctx.currentTime + .15; const beat = .46;
  seq.forEach(([n, d], i) => {
    const f = N[n];
    [[1, .7, "sine"], [2, .18, "sine"], [3, .06, "triangle"], [4.2, .05, "sine"]].forEach(([m, g, type]) => {
      const o = ctx.createOscillator(), a = ctx.createGain();
      o.type = type; o.frequency.value = f * m;
      a.gain.setValueAtTime(0, t);
      a.gain.linearRampToValueAtTime(g, t + .006);
      a.gain.exponentialRampToValueAtTime(.0001, t + Math.max(1.1, d * beat * 1.8) / (m > 1 ? 1.6 : 1));
      o.connect(a); a.connect(master); o.start(t); o.stop(t + 2.5);
    });
    t += d * beat * (i > seq.length - 4 ? 1.12 : 1);
  });
}
function chime(){
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + .02;
  [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * .08;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.1, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 1.9);
  });
}
function puff(){
  const ctx = actx; if (!ctx) return;
  const len = ctx.sampleRate * .35, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "bandpass"; f.frequency.value = 900; f.Q.value = .7; g.gain.value = .07;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(ctx.destination); s.start();
}

/* ---------- state ---------- */
let armed = false, celebrating = false, holdOn = false, level = 0;
const meterBar = $("#meter i");
function setStatus(t){ statusEl.style.opacity = 0; setTimeout(() => { statusEl.textContent = t; statusEl.style.opacity = 1; }, 280); }

function setHint(t){ const h = $("#hint"); h.classList.remove("show"); setTimeout(() => { h.textContent = t; if (t) h.classList.add("show"); }, 300); }
function readyHint(){ setHint(""); }
function intro(){
  const box = $("#cakebox"), lighter = $("#lighter"), cand = $("#candles"), fl = $("#flames"), lf = $("#lighterFlame");
  cand.style.opacity = 0; cand.style.transform = "translate(0px,-220px)";
  fl.style.opacity = 0; fl.style.transform = "translate(0px,-220px)";
  let started = false;
  box.addEventListener("click", () => {
    if (started) return; started = true;
    unlockAudio(); setHint("");
    const T = (ms, fn) => setTimeout(fn, ms);
    T(0, () => { box.classList.add("untie"); untieSound(); box.style.pointerEvents = "none"; });
    T(1100, () => { whoosh(1.4, 300, 1600, .22); box.style.transform = "translate(0px,-560px)"; box.style.opacity = 0; });
    T(2800, () => { cand.style.opacity = 1; cand.style.transform = "none"; fl.style.opacity = 1; fl.style.transform = "none"; whoosh(.9, 1200, 500, .06); });
    T(3950, () => thud());
    T(4600, () => { lighter.style.opacity = 1; lighter.style.transform = "none"; });
    T(6000, () => { click(); });
    T(6150, () => { lf.setAttribute("opacity", "1"); whoosh(.35, 600, 900, .12); });
    T(6700, () => { flames.forEach(f => { f.out = false; f.life = .05; f.boot = true; f.g.classList.remove("out", "unlit"); }); whoosh(.6, 400, 1400, .2); sparkle(); });
    T(7300, () => { if (!micOn) enableMic(); });
    T(7400, () => { lf.setAttribute("opacity", "0"); lighter.style.transform = "translate(220px,40px) rotate(14deg)"; lighter.style.opacity = 0; });
    T(8200, () => { armed = true; readyHint(); });
  });
}
function noiseBuf(ctx, sec){
  const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function whoosh(dur, f0, f1, vol){
  const ctx = actx; if (!ctx) return;
  const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf(ctx, dur); f.type = "bandpass"; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .35); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + dur);
}
function untieSound(){
  const ctx = actx; if (!ctx) return;
  const t = ctx.currentTime;
  // silky ribbon pull
  const s1 = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s1.buffer = noiseBuf(ctx, .7); f.type = "bandpass"; f.Q.value = 2.5;
  f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(1400, t + .6);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
  s1.connect(f); f.connect(g); g.connect(ctx.destination); s1.start(t); s1.stop(t + .7);
  // little pop as the knot releases
  const o = ctx.createOscillator(), g2 = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(900, t + .15); o.frequency.exponentialRampToValueAtTime(380, t + .26);
  g2.gain.setValueAtTime(0, t + .15); g2.gain.linearRampToValueAtTime(.18, t + .16); g2.gain.exponentialRampToValueAtTime(.0001, t + .32);
  o.connect(g2); g2.connect(ctx.destination); o.start(t + .15); o.stop(t + .35);
  // soft sparkle
  [2349, 2793, 3136].forEach((fr, i) => {
    const oo = ctx.createOscillator(), gg = ctx.createGain(), tt = t + .3 + i * .06;
    oo.type = "sine"; oo.frequency.value = fr;
    gg.gain.setValueAtTime(0, tt); gg.gain.linearRampToValueAtTime(.035, tt + .01); gg.gain.exponentialRampToValueAtTime(.0001, tt + .8);
    oo.connect(gg); gg.connect(ctx.destination); oo.start(tt); oo.stop(tt + .9);
  });
}
function thud(){
  const ctx = actx; if (!ctx) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(55, t + .18);
  g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .3);
}
function sparkle(){
  const ctx = actx; if (!ctx) return;
  const t0 = ctx.currentTime + .05;
  [1568, 2093, 2637].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * .07;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.2);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 1.3);
  });
}
function click(){
  const ctx = actx; if (!ctx) return;
  const len = ctx.sampleRate * .05, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = .25; s.buffer = b; s.connect(g); g.connect(ctx.destination); s.start();
}
function ignite(){
  flames.forEach((f, i) => setTimeout(() => {
    f.out = false; f.life = .05; f.boot = true;
    f.g.classList.remove("out", "unlit");
  }, 900 + i * 320));
  setTimeout(() => { armed = true; readyHint(); }, 900 + flames.length * 320 + 600);
}

function extinguish(f, force){
  if (f.out) return;
  f.out = true; f.life = 0;
  f.g.classList.add("out");
  puff();
  const p = new DOMPoint(0, -4).matrixTransform(f.g.getScreenCTM());
  for (let i = 0; i < 5; i++) {
    const s = document.createElement("div");
    s.className = "smoke";
    const side = f.dir * -1;
    s.style.left = p.x + "px"; s.style.top = p.y + "px";
    s.style.setProperty("--dx1", (side * (8 + Math.random() * 14) + (Math.random() - .5) * 10) + "px");
    s.style.setProperty("--dx2", (side * (-6 + Math.random() * 30) + (Math.random() - .5) * 30) + "px");
    s.style.setProperty("--delay", (i * .14) + "s");
    s.style.setProperty("--dur", (2.2 + Math.random() * 1.2) + "s");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
  const remaining = flames.filter(x => !x.out).length;
  if (remaining > 0 && remaining < flames.length) setStatus(`仲有 ${remaining} 枝，再吹多啖 ～`);
  if (remaining === 0) { armed = false; setTimeout(celebrate, 1100); }
}

function celebrate(){
  celebrating = true;
  stopMic(); $("#meter").classList.remove("show");
  document.body.classList.add("celebrate");
  const r = $("#stage").getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * .35, r.width * .32);
  setTimeout(playSong, 1000);
  const card = $("#card");
  card.querySelectorAll("p").forEach((p, i) => p.style.transitionDelay = (1 + i * .45) + "s");
  flowTimer = setTimeout(showMem, 1800);
}

function relight(){
  const card = $("#card"); card.classList.remove("show");
  card.querySelectorAll("p").forEach(p => p.style.transitionDelay = "0s");
  document.body.classList.remove("celebrate");
  celebrating = false;
  setStatus("再許多個願啦");
  flames.forEach(f => { f.g.classList.add("unlit"); f.g.classList.remove("out"); f.out = true; });
  ignite();
  if (micWanted) setTimeout(enableMic, 300);
}

/* ---------- inputs ---------- */
$("#micBtn").addEventListener("click", () => { if (micOn) { stopMic(); $("#meter").classList.remove("show"); setStatus("來自細佬的祝福"); micWanted = false; } else enableMic(); });

/* ---------- memories (auto) ---------- */
const mem = $("#mem"), deck = $("#deck");
const POSE = [[-4,-10,-6],[3,10,4],[-2,-6,8],[5,8,-4],[-1,0,0]];
const figs = PHOTOS.map((src, i) => {
  const f = document.createElement("figure"); const img = new Image(); img.src = src; img.alt = "";
  f.appendChild(img); deck.appendChild(f);
  const [r, x, y] = POSE[i % POSE.length];
  f.dataset.pose = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${r}deg)`;
  f.style.zIndex = i + 1; f.style.opacity = 0;
  f.style.transform = `translate(-50%,-62%) rotate(${r * 3}deg) scale(1.25)`;
  return f;
});
let flowTimer = null, placed = 0, memOn = false;
function placeNext(){
  clearTimeout(flowTimer);
  if (placed < figs.length) {
    const f = figs[placed++];
    f.style.opacity = 1; f.style.transform = f.dataset.pose;
    if (placed < figs.length) flowTimer = setTimeout(placeNext, 3400);
  }
}
function showMem(){
  if (memOn) return; memOn = true; clearTimeout(flowTimer);
  const card = $("#card");
  card.querySelectorAll("p").forEach((p, i) => p.style.transitionDelay = (.8 + i * .45) + "s");
  card.classList.add("show");
  mem.classList.add("show"); mem.scrollTop = 0;
  flowTimer = setTimeout(placeNext, 900);
  nextTimer = setTimeout(() => $("#nextBtn").classList.add("show"), 5500);
}
let nextTimer = null;
mem.addEventListener("click", () => { if (memOn) placeNext(); });
$("#nextBtn").addEventListener("click", e => { e.stopPropagation(); clearTimeout(nextTimer); $("#nextBtn").classList.remove("show"); showGift(); });

/* ---------- gift ---------- */
const gift = $("#gift");
function showGift(){
  clearTimeout(flowTimer);
  gift.classList.remove("opening", "opened");
  gift.classList.add("show");
  gift.scrollTop = 0;
  // keep the photo page underneath until the gift page has fully faded in
  setTimeout(() => { $("#card").classList.remove("show"); mem.classList.remove("show"); }, 1000);
}
$("#giftbox").addEventListener("click", () => {
  if (gift.classList.contains("opening")) return;
  ensureAudio();
  gift.classList.add("opening");
  setTimeout(chime, 300);
  setTimeout(() => burst(innerWidth / 2, innerHeight * .45, 40), 550);
  setTimeout(() => gift.classList.add("opened"), 1200);
});


/* ---------- main loop ---------- */
const toplight = $("#toplight");
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const micL = micOn && analyser ? readMic() : 0;
  const target = micL;
  level += (target - level) * Math.min(1, dt * (target > level ? 16 : 5));
  meterBar.style.width = (level * 100).toFixed(1) + "%";

  let lifeSum = 0;
  const t = now / 1000;
  for (const f of flames) {
    if (f.out) continue;
    if (armed && level > .12) f.life -= dt * (.8 + level) * 2.6 / f.resist;
    else f.life = Math.min(1, f.life + dt * (f.boot ? 1.6 : .4));
    if (f.boot && f.life >= 1) f.boot = false;
    if (f.life <= 0) { extinguish(f); continue; }
    const wob = Math.sin(t * 9 + f.phase) * level * 6 + Math.sin(t * 2.3 + f.phase) * 1.2;
    const ang = f.dir * level * 32 + wob;
    const L = Math.max(.15, f.life);
    const sy = L * (1 - level * .3), sx = .6 + .4 * L + level * .12;
    f.bend.setAttribute("transform", `rotate(${ang.toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
    f.glow.style.opacity = ((.3 + .7 * L) * (1 - level * .35) * (0.92 + Math.sin(t * 11 + f.phase) * .08)).toFixed(3);
    lifeSum += L;
  }
  const lit = lifeSum / flames.length;
  document.documentElement.style.setProperty("--lit", lit.toFixed(3));
  toplight.style.opacity = (lit * .95).toFixed(3);
  requestAnimationFrame(frame);
}

/* ---------- background bokeh ---------- */
const bg = $("#bg"), bctx = bg.getContext("2d");
const fxc = $("#fx"), fctx = fxc.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [bg, fxc]) { c.width = W * DPR; c.height = H * DPR; c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0); }
}
resize(); addEventListener("resize", resize);
const sprite = document.createElement("canvas"); sprite.width = sprite.height = 64;
{ const s = sprite.getContext("2d"), g = s.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,226,160,1)"); g.addColorStop(.35, "rgba(240,190,110,.45)"); g.addColorStop(1, "rgba(240,190,110,0)");
  s.fillStyle = g; s.fillRect(0, 0, 64, 64); }
const motes = Array.from({ length: reduce ? 24 : 58 }, () => {
  const big = Math.random() < .22;
  return { x: Math.random(), y: Math.random(), r: big ? 10 + Math.random() * 22 : 1.5 + Math.random() * 4,
    a: big ? .05 + Math.random() * .08 : .25 + Math.random() * .5, v: .004 + Math.random() * .012, tw: Math.random() * 6, sw: Math.random() * 6 };
});
function drawBg(now){
  const t = now / 1000;
  bctx.clearRect(0, 0, W, H);
  bctx.globalCompositeOperation = "lighter";
  for (const m of motes) {
    m.y -= m.v * (1 / 60); if (m.y < -.05) { m.y = 1.05; m.x = Math.random(); }
    const x = (m.x + Math.sin(t * .2 + m.sw) * .01) * W, y = m.y * H;
    bctx.globalAlpha = m.a * (.6 + .4 * Math.sin(t * 1.3 + m.tw));
    const s = m.r * 2.4; bctx.drawImage(sprite, x - s / 2, y - s / 2, s, s);
  }
  bctx.globalAlpha = 1; bctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(drawBg);
}

/* ---------- confetti ---------- */
const COLORS = ["#d9b46a", "#f6e3b0", "#fff4dc", "#e3a6ae", "#c98a52", "#f2c9cf"];
let bits = [], fxRunning = false;
function burst(cx, cy, spread){
  const n = reduce ? 70 : (W < 500 ? 150 : 200);
  for (let i = 0; i < n; i++) {
    const fromSide = i % 2 ? 1 : -1, cannon = i < n * .55;
    const ang = cannon ? (-Math.PI / 2 + fromSide * (.35 + Math.random() * .5)) : Math.random() * Math.PI * 2;
    const sp = cannon ? 520 + Math.random() * 520 : 0;
    bits.push({
      x: cannon ? cx + fromSide * spread : Math.random() * W,
      y: cannon ? cy + 40 : -20 - Math.random() * H * .6,
      vx: Math.cos(ang) * sp, vy: cannon ? Math.sin(ang) * sp : 40 + Math.random() * 60,
      w: 5 + Math.random() * 7, h: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * 10,
      tilt: Math.random() * 6, c: COLORS[(Math.random() * COLORS.length) | 0], star: Math.random() < .14, life: 0
    });
  }
  if (!fxRunning) { fxRunning = true; last2 = performance.now(); requestAnimationFrame(drawFx); }
}
let last2 = 0;
function drawFx(now){
  const dt = Math.min(.04, (now - last2) / 1000); last2 = now;
  fctx.clearRect(0, 0, W, H);
  bits = bits.filter(b => b.y < H + 40 && b.life < 9);
  for (const b of bits) {
    b.life += dt;
    b.vx *= Math.pow(.35, dt); b.vy = b.vy * Math.pow(.5, dt) + 260 * dt;
    if (b.vy > 140) b.vy = 140 - 0;
    b.x += (b.vx + Math.sin(b.life * 3 + b.tilt) * 30) * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    fctx.save(); fctx.translate(b.x, b.y); fctx.rotate(b.rot);
    if (b.star) {
      fctx.globalAlpha = .6 + .4 * Math.sin(b.life * 12);
      fctx.fillStyle = "#fff3cf"; const s = b.w * .7;
      fctx.beginPath(); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; fctx.lineTo(Math.cos(a) * s, Math.sin(a) * s); fctx.lineTo(Math.cos(a + Math.PI / 4) * s * .28, Math.sin(a + Math.PI / 4) * s * .28); }
      fctx.closePath(); fctx.fill();
    } else {
      fctx.scale(1, Math.cos(b.life * 6 + b.tilt));
      fctx.fillStyle = b.c; fctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    }
    fctx.restore();
  }
  if (bits.length) requestAnimationFrame(drawFx); else { fxRunning = false; fctx.clearRect(0, 0, W, H); }
}

requestAnimationFrame(frame);
requestAnimationFrame(drawBg);
intro();
})();
